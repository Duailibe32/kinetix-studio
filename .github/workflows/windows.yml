name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile and package
        shell: pwsh
        run: ./build.ps1 -Package -Installer
      - name: Tests without external driver
        shell: pwsh
        run: |
          ./.build/tests/KinetixStudio.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KinetixStudio-Windows-x64
          path: |
            KinetixStudio-*-win-x64.zip
            KinetixStudio-*-win-x64.zip.sha256
            installer-output/KinetixStudio-Setup.exe
            installer-output/KinetixStudio-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
